spring.application.name=airline-checkin-demo-portal
spring.datasource.url=jdbc:h2:mem:checkin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
demo.security.admin.username=${DEMO_ADMIN_USERNAME:demo-admin}
demo.security.admin.password=${DEMO_ADMIN_PASSWORD:demo-admin-only}
demo.security.staff.username=${DEMO_STAFF_USERNAME:demo-staff}
demo.security.staff.password=${DEMO_STAFF_PASSWORD:demo-staff-only}
